<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watson Core Printing | Website concept</title>
<meta name="description" content="Concept website for Watson Core Printing: personalised foil prints, photo gifts, photo printing, passport photos and framing.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121212">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #ffffff; }
a { color: #121212; }
a:hover { color: #121212; }
.wcp *, .wcp *::before, .wcp *::after { box-sizing: border-box; }
.wcp button, .wcp input, .wcp textarea { font: inherit; letter-spacing: inherit; color: inherit; }
.wcp button { cursor: pointer; }
.wcp :focus-visible { outline: 2px solid #121212; outline-offset: 3px; }
.wcp h1, .wcp h2, .wcp h3, .wcp p, .wcp ul, .wcp ol { margin: 0; }
.wrap { width: 100%; max-width: 1240px; margin-left: auto; margin-right: auto; padding-left: 24px; padding-right: 24px; }
.muted { color: rgba(18,18,18,.75); }
.lk { background: none; border: 0; padding: 0; min-height: 44px; display: inline-flex; align-items: center; text-align: left; text-decoration: underline; text-decoration-color: rgba(18,18,18,.4); text-underline-offset: 4px; }
.lk:hover { text-decoration-color: #121212; text-decoration-thickness: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 28px; border: 1px solid #121212; background: #ffffff; color: #121212; font-size: 15px; letter-spacing: 0.06em; text-align: center; }
.btn:hover { box-shadow: 0 0 0 1px #121212; }
.btn.fill { background: #121212; color: #ffffff; }
.btn.fill:hover { background: #333333; box-shadow: none; }
.btn.inv { background: transparent; color: #ffffff; border-color: #ffffff; }
.btn.inv:hover { background: #ffffff; color: #121212; box-shadow: none; }
.btn.block { width: 100%; }
.ico { position: relative; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; }
.ico:hover svg { transform: scale(1.08); }
.badge { position: absolute; right: 2px; bottom: 4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #121212; color: #ffffff; font-size: 11px; line-height: 18px; letter-spacing: 0; text-align: center; }
.logo { background: none; border: 0; padding: 0; display: flex; justify-content: center; }
.nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 4px; }
.nav-b { background: none; border: 0; min-height: 44px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: rgba(18,18,18,.78); }
.nav-b:hover, .nav-b.is-on { color: #121212; text-decoration: underline; text-underline-offset: 6px; }
.mega { border-top: 1px solid rgba(18,18,18,.1); padding: 20px 0 28px; }
.mega-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 16px 32px; }
.mega-l { display: flex; width: 100%; min-height: 44px; align-items: center; background: none; border: 0; padding: 0; text-align: left; font-size: 15px; }
.mega-l:hover { text-decoration: underline; text-underline-offset: 4px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { min-height: 44px; padding: 0 20px; border-radius: 40px; border: 1px solid rgba(18,18,18,.55); background: #ffffff; font-size: 14px; }
.pill:hover { border-color: #121212; box-shadow: 0 0 0 1px #121212; }
.pill.is-on { background: #121212; border-color: #121212; color: #ffffff; }
.sws { display: flex; flex-wrap: wrap; gap: 12px; }
.sw { width: 44px; height: 44px; border-radius: 50%; border: 12px solid; padding: 0; box-shadow: 0 0 0 1px rgba(18,18,18,.3); }
.sw.is-on { box-shadow: 0 0 0 3px #ffffff, 0 0 0 5px #121212; }
.grid { display: grid; gap: 32px 20px; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); }
.grid.g3 { grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); }
.tile { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.tile-t { margin-top: 10px; font-size: 15px; }
.tile:hover .tile-t { text-decoration: underline; text-underline-offset: 4px; }
.tile-p { font-size: 17px; }
.vis { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #F3F1ED; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 16px; letter-spacing: 0; }
.vis-card { width: 52%; aspect-ratio: 4 / 5; display: flex; }
.vis-win { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
.vis-win svg { width: 62%; height: auto; }
.vis-tag { position: absolute; left: 12px; bottom: 9px; font-size: 12px; letter-spacing: 0.04em; color: #5A5750; }
.vis.big { font-size: 34px; }
.vis.sm { width: 84px; flex: none; font-size: 6px; }
.vis.sm .vis-tag { display: none; }
.cats { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); }
.cats.sizes { grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); }
.cat { display: flex; flex-direction: column; gap: 6px; min-height: 172px; padding: 22px; border: 1px solid rgba(18,18,18,.16); background: #ffffff; text-align: left; }
.cat:hover { border-color: #121212; box-shadow: 0 0 0 1px #121212; }
.cat svg { width: 44px; height: 44px; margin-bottom: 10px; }
.cat-t { font-size: 19px; }
.cat-d { font-size: 14px; color: rgba(18,18,18,.75); }
.lbl { display: block; font-size: 14px; margin-bottom: 6px; color: rgba(18,18,18,.78); }
.inp { display: block; width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid rgba(18,18,18,.55); border-radius: 0; background: #ffffff; }
.inp:focus { outline: 2px solid #121212; outline-offset: 1px; }
.box { border: 1px solid rgba(18,18,18,.16); padding: 24px; }
.qty { display: inline-flex; align-items: center; border: 1px solid rgba(18,18,18,.55); }
.qty button { width: 44px; height: 46px; background: none; border: 0; font-size: 18px; }
.qty span { min-width: 40px; text-align: center; }
.split { display: grid; gap: 40px; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); align-items: start; }
.row { display: grid; grid-template-columns: 90px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(18,18,18,.14); }
.pay { font-size: 12px; padding: 4px 8px; border: 1px solid rgba(18,18,18,.25); color: rgba(18,18,18,.8); }
.show-narrow { display: none; }
@media (max-width: 860px) {
  .hide-narrow { display: none; }
  .show-narrow { display: inline-flex; }
}
.vis-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
.pt { font-size: clamp(32px, 3.6vw, 44px); line-height: 1.15; font-weight: 400; }
.pg { padding-top: 20px; padding-bottom: 80px; }
.lead { margin-top: 12px; max-width: 38em; font-size: 18px; color: rgba(18,18,18,.78); }
.h2 { font-size: 30px; line-height: 1.2; font-weight: 400; }
.h3 { font-size: 18px; font-weight: 600; }
.wcp .mt4 { margin-top: 4px; }
@media (max-width: 600px) {
  .cats, .cats.sizes, .grid, .grid.g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cats { gap: 10px; }
  .grid { gap: 24px 12px; }
  .cat { min-height: 0; padding: 16px; }
  .cat-t { font-size: 17px; }
}
</style>
</head>
<body>
<div id="app"></div>
<template id="part-tile">
<button class="tile" onClick="{{ t.go }}">
<span class="vis">
<span class="vis-card" style="border: {{ t.fw }} solid {{ t.fc }}; background: {{ t.mc }}; padding: {{ t.pad }}; box-shadow: inset 0 0 0 2px {{ t.lip }}, 0 0 0 1px rgba(18,18,18,.14), 0 16px 22px -16px rgba(18,18,18,.5)">
<span class="vis-win" style="background: {{ t.win }}; box-shadow: 0 0 0 0.16em {{ t.wl }}">
<svg viewBox="0 0 48 48" fill="none" stroke="{{ t.ink }}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.d }}"></path></svg>
</span>
</span>
<span class="vis-tag">Photo to add</span>
<sc-if value="{{ t.hasImg }}"><img class="vis-img" src="{{ t.img }}" alt="{{ t.t }}"></sc-if>
</span>
<span class="tile-t">{{ t.t }}</span>
<span class="tile-p">{{ t.price }}</span>
</button>
</template>
<template id="tpl">
<div id="wcp-top" class="wcp" style="font-family: Assistant, Segoe UI, Helvetica Neue, sans-serif; font-size: 16px; line-height: 1.55; letter-spacing: 0.02em; color: #121212; background: #ffffff">
<div style="background: #121212; color: #ffffff; font-size: 13px; letter-spacing: 0.08em">
<div class="wrap" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 40px; padding-top: 9px; padding-bottom: 9px; text-align: center">
<span>Personalised foil prints, photo gifts and framing</span>
<span class="hide-narrow">Order online, then collect in store or have it delivered</span>
</div>
</div>
<header style="border-bottom: 1px solid rgba(18,18,18,.1)">
<div class="wrap" style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding-top: 16px; padding-bottom: 8px">
<div style="display: flex; align-items: center; gap: 2px">
<button class="ico show-narrow" aria-label="Menu" onClick="{{ toggleRoot }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button>
<button class="ico" aria-label="Search" onClick="{{ goSearch }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg></button>
</div>
<button class="logo" aria-label="Watson Core Printing home" onClick="{{ goHome }}"><img src="https://www.watsoncoreprinting.co.uk/cdn/shop/files/WCP_Black.jpg?width=600" alt="Watson Core Printing" style="display: block; width: 210px; max-width: 44vw; height: auto"></button>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 2px">
<span class="hide-narrow" style="font-size: 14px; margin-right: 12px; color: rgba(18,18,18,.78)">United Kingdom | GBP £</span>
<button class="ico hide-narrow" aria-label="Log in" onClick="{{ goAccount }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg></button>
<button class="ico" aria-label="Cart" onClick="{{ goCart }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><sc-if value="{{ hasCart }}"><span class="badge">{{ cartCount }}</span></sc-if></button>
</div>
</div>
<div class="wrap hide-narrow" style="padding-bottom: 8px">
<nav class="nav" aria-label="Main">
<sc-for list="{{ nav }}" as="n">
<button class="nav-b {{ n.cls }}" aria-expanded="{{ n.open }}" onClick="{{ n.go }}">{{ n.t }}<sc-if value="{{ n.has }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></sc-if></button>
</sc-for>
</nav>
</div>
<sc-if value="{{ menuOpen }}">
<div class="mega">
<div class="wrap">
<sc-if value="{{ menuRoot }}">
<div style="display: flex; flex-direction: column">
<sc-for list="{{ nav }}" as="n">
<button class="mega-l" onClick="{{ n.go }}" style="font-size: 17px; border-bottom: 1px solid rgba(18,18,18,.08)">{{ n.t }}</button>
</sc-for>
<button class="mega-l" onClick="{{ goAccount }}" style="font-size: 17px">Log in</button>
</div>
</sc-if>
<sc-if value="{{ menuGroup }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px">
<span style="font-size: 20px">{{ menuTitle }}</span>
<sc-if value="{{ hasMenuAll }}"><button class="lk" onClick="{{ menuAll }}" style="font-size: 15px">{{ menuAllT }}</button></sc-if>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<button class="lk show-narrow" onClick="{{ menuBack }}" style="font-size: 15px">All categories</button>
<button class="ico" aria-label="Close menu" onClick="{{ closeMenu }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button>
</div>
</div>
<div class="mega-cols">
<sc-for list="{{ menuSecs }}" as="sec">
<div>
<p style="font-size: 14px; color: rgba(18,18,18,.7); padding-bottom: 4px; border-bottom: 1px solid rgba(18,18,18,.1); margin-bottom: 4px">{{ sec.t }}</p>
<sc-for list="{{ sec.links }}" as="l">
<button class="mega-l" onClick="{{ l.go }}">{{ l.t }}</button>
</sc-for>
</div>
</sc-for>
</div>
</div>
</sc-if>
</div>
</div>
</sc-if>
</header>
<main>
<sc-if value="{{ notHome }}">
<div class="wrap" style="padding-top: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px; font-size: 14px; color: rgba(18,18,18,.75)">
<sc-for list="{{ crumbs }}" as="b">
<span style="display: inline-flex; align-items: center; gap: 10px"><button class="lk" onClick="{{ b.go }}">{{ b.t }}</button><span aria-hidden="true">/</span></span>
</sc-for>
<span>{{ here }}</span>
</div>
</div>
</sc-if>
<sc-if value="{{ isHome }}">
<div>
<section style="background: #F3F1ED">
<div class="wrap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 40px; align-items: center; padding-top: 56px; padding-bottom: 56px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 22px">
<h1 style="font-size: clamp(36px, 4.4vw, 58px); line-height: 1.08; font-weight: 400; letter-spacing: 0">Foil prints, photo gifts and framing, made to order</h1>
<p style="font-size: 19px; max-width: 32em; color: rgba(18,18,18,.78)">Hand-pressed foil prints of your maps, marathons, pets and photos, from £14.99. Plus photo gifts, photo printing, passport photos and framing, all in one place.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button class="btn fill" onClick="{{ goFoil }}">Shop foil prints</button>
<button class="btn" onClick="{{ goGifts }}">Shop photo gifts</button>
</div>
</div>
<div style="position: relative; min-height: 440px; background: #D9D1C4; display: flex; align-items: center; justify-content: center; padding: 40px 24px">
<div style="width: min(290px, 72%); background: #ffffff; padding: 22px 22px 20px; transform: rotate(-3deg); box-shadow: 0 30px 40px -24px rgba(18,18,18,.55); display: flex; flex-direction: column; align-items: center; gap: 12px">
<svg viewBox="0 0 200 224" fill="none" stroke="{{ accent }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; width: 100%; height: auto">
<path stroke-width="1.3" d="M4 44h192M4 98h192M4 152h126M58 6v208M132 6v146M132 152l62 54M4 196l54-44M96 152v66"></path>
<path stroke-width="0.9" d="M28 6l30 38M96 44l36 54M150 98l44 40M26 152v44M160 6v38M4 70h54M132 70h64M96 98v54M170 152v36"></path>
<path stroke-width="5" d="M2 126c26-18 48 8 76-6s38-36 66-22 30 4 54-2"></path>
<path stroke-width="1.3" d="M127 98a5 5 0 1 0 10 0 5 5 0 1 0-10 0"></path>
</svg>
<span style="font-family: Georgia, serif; font-size: 15px; letter-spacing: 0.42em; padding-left: 0.42em; color: #7A5F17">YOUR PLACE</span>
<span style="font-family: Georgia, serif; font-size: 12px; letter-spacing: 0.04em; color: #7A5F17">Names, a date, a few words</span>
</div>
<span class="vis-tag">Photo to add</span>
<sc-if value="{{ hasHero }}"><img class="vis-img" src="{{ heroImg }}" alt="A foil print by Watson Core Printing"></sc-if>
</div>
</div>
</section>
<section class="wrap" style="padding-top: 72px">
<h2 style="font-size: 30px; line-height: 1.2; font-weight: 400; margin-bottom: 24px">What we make</h2>
<div class="cats">
<sc-for list="{{ cats }}" as="c">
<button class="cat" onClick="{{ c.go }}">
<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ c.d }}"></path></svg>
<span class="cat-t">{{ c.t }}</span>
<span class="cat-d">{{ c.x }}</span>
</button>
</sc-for>
</div>
</section>
<section class="wrap" style="padding-top: 72px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; margin-bottom: 24px">
<div>
<h2 class="h2">Personalise all our products</h2>
<p class="muted" style="margin-top: 6px">Six foil prints, each made from your own place, race, pet or photo.</p>
</div>
<button class="lk" onClick="{{ goFoil }}">View all foil prints</button>
</div>
<div class="grid g3">
<sc-for list="{{ foil }}" as="t">
<sc-inc name="tile"></sc-inc>
</sc-for>
</div>
</section>
<section style="background: #121212; color: #ffffff; margin-top: 72px">
<div class="wrap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 40px 48px; padding-top: 60px; padding-bottom: 60px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px">
<svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="{{ accent }}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 15V9h26v22h-4M8 15h28v24H8zM8 33l8-8 6 6 5-5 9 9"></path></svg>
<h2 style="font-size: 24px; line-height: 1.2; font-weight: 400">Print your photos</h2>
<p style="color: rgba(255,255,255,.84)">Send photos from your phone or computer, then collect your prints in store or have them posted.</p>
<button class="btn inv" onClick="{{ goPrinting }}" style="margin-top: 6px">Order prints</button>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px">
<svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="{{ accent }}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8h24v32H12zM19 20a5 5 0 1 0 10 0 5 5 0 1 0-10 0M15 40c0-7 4-11 9-11s9 4 9 11"></path></svg>
<h2 style="font-size: 24px; line-height: 1.2; font-weight: 400">Passport and ID photos</h2>
<p style="color: rgba(255,255,255,.84)">Printed photos, or a digital code for online applications. Any country, any age.</p>
<button class="btn inv" onClick="{{ goPassport }}" style="margin-top: 6px">See passport photos</button>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px">
<svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="{{ accent }}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8h32v32H8zM15 15h18v18H15zM8 8l7 7M40 8l-7 7M40 40l-7-7M8 40l7-7"></path></svg>
<h2 style="font-size: 24px; line-height: 1.2; font-weight: 400">Bespoke framing</h2>
<p style="color: rgba(255,255,255,.84)">Medals, shirts, artwork, certificates and keepsakes. What can we frame for you?</p>
<button class="btn inv" onClick="{{ goBespoke }}" style="margin-top: 6px">Ask about framing</button>
</div>
</div>
</section>
<section class="wrap" style="padding-top: 72px">
<h2 class="h2">Turn a photo into wall art</h2>
<p class="muted" style="margin-top: 6px; margin-bottom: 24px">Photo canvases, stretched over a wooden frame and ready to hang.</p>
<div class="cats sizes">
<sc-for list="{{ canvasSizes }}" as="c">
<button class="cat" onClick="{{ c.go }}" style="min-height: 130px">
<span class="cat-t">{{ c.l }}</span>
<span class="cat-d">Photo canvas</span>
<span style="margin-top: auto; font-size: 18px">{{ c.price }}</span>
</button>
</sc-for>
</div>
</section>
<section class="wrap" style="padding-top: 72px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; margin-bottom: 24px">
<h2 class="h2">Photo gifts</h2>
<button class="lk" onClick="{{ goGifts }}">View all photo gifts</button>
</div>
<div class="grid">
<sc-for list="{{ gifts4 }}" as="t">
<sc-inc name="tile"></sc-inc>
</sc-for>
</div>
</section>
<section style="background: #F3F1ED; margin-top: 72px">
<div class="wrap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 32px 48px; align-items: center; padding-top: 60px; padding-bottom: 60px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 14px">
<h2 class="h2">Order online, collect in store</h2>
<p style="max-width: 32em; color: rgba(18,18,18,.78)">Choose click and collect at checkout. We email you when your order is ready, and collection is free.</p>
<button class="btn" onClick="{{ goStores }}">Store details</button>
</div>
<div style="background: #ffffff; padding: 28px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 20px">[Shop name]</span>
<span>[Address line 1, town, postcode]</span>
<span>[Phone number]</span>
<span style="margin-top: 8px">[Opening hours]</span>
</div>
</div>
</section>
